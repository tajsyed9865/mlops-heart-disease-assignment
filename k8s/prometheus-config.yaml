# Prometheus Scrape Configuration for Heart Disease Serving API
# Task 8 of AIMLCZG523 MLOps Assignment 01
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-server-conf
  labels:
    name: prometheus-server-conf
data:
  prometheus.yml: |-
    global:
      scrape_interval: 5s
      evaluation_interval: 5s

    scrape_configs:
      - job_name: "heart-disease-fastapi"
        metrics_path: "/metrics"
        static_configs:
          - targets: ["heart-disease-api-service:80"]
            labels:
              app: "heart-disease-api"
              env: "production"
