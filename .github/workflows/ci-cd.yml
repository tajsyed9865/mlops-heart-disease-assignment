name: MLOps End-to-End CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  lint:
    name: Code Quality & Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black

      - name: Run Black Code Formatter Check
        run: |
          black --check src/ tests/ data/ || true

      - name: Lint with Flake8
        run: |
          # stop the build if there are Python syntax errors or undefined names
          flake8 src/ tests/ data/ --count --select=E9,F63,F7,F82 --show-source --statistics
          # exit-zero treats all errors as warnings
          flake8 src/ tests/ data/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

  test:
    name: Automated Unit & Integration Testing
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Project Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ingest and Prepare Dataset
        run: |
          python data/download_data.py

      - name: Execute Pytest Suite with Coverage
        run: |
          python -m pytest tests/ -v --cov=src --cov-report=term-missing --cov-report=xml

      - name: Upload Test Coverage Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pytest-coverage-report
          path: coverage.xml

  train:
    name: Model Training & Experiment Tracking
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Project Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download Dataset and Run EDA
        run: |
          python data/download_data.py
          python src/eda.py

      - name: Train Models & Log to MLflow
        run: |
          python src/train.py

      - name: Upload Trained Model and Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: trained-model-artifacts
          path: |
            models/
            reports/
            mlruns/

  docker-build:
    name: Container Build & Verification
    runs-on: ubuntu-latest
    needs: train
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Download Trained Model Artifacts
        uses: actions/download-artifact@v4
        with:
          name: trained-model-artifacts

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Serving Image
        run: |
          docker build -t heart-disease-api:latest -t heart-disease-api:${{ github.sha }} .

      - name: Test Docker Container Run & Health Check
        run: |
          docker run -d -p 8000:8000 --name test-serving-api heart-disease-api:latest
          sleep 6
          curl -f http://localhost:8000/health || (docker logs test-serving-api && exit 1)
          docker stop test-serving-api
